name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      # Frozen lockfile: CI never resolves anything the lockfile doesn't already pin.
      - run: bun ci

      # Formatting: prettier --check, so tabs-vs-spaces never drifts again.
      - run: bun run lint

      # svelte-check: types and template errors across .ts and .svelte files.
      - run: bun run check

      # Tests with coverage against an in-memory SQLite database and a temp audio
      # directory; bunfig.toml sets the threshold. No services needed. The
      # threshold only applies to files a test imports; the gap script names
      # the rest so the number is read honestly.
      - run: bun test --coverage
      - run: bun scripts/coverage-gap.ts

      # Production bundle via svelte-adapter-bun. Bootstrap (database, data dir) runs at boot, not build.
      - run: bun run build

      # The built server end to end: multipart upload, ranged playback, the
      # host allowlist, the body limit, practice PATCH, export. Skipped above
      # because the build did not exist yet.
      - run: bun test src/server.test.ts

      # The single-file binary for this platform: keeps the CLI wrapper and the
      # asset embedding honest. Cross-compiles happen in release.yml on tags.
      - run: bun run build:binary
      - run: ./dist/voice-training --version
