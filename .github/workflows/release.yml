name: Release

# Pushing a tag like v1.0.0 builds the single-file binaries for every platform
# and publishes them as a GitHub release. The tag must match package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  # For the build-provenance attestation on the packaged binaries.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # An exact patch, so the compiler behind a build (and a tagged binary's
          # checksums) is reproducible from the tag; bump it with packageManager.
          bun-version: 1.4.2

      - name: Tag matches package.json
        run: |
          version="v$(bun -p 'require("./package.json").version')"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json ($version)"; exit 1
          fi

      - run: bun ci
      - run: bun run lint
      - run: bun run check
      - run: bun test --coverage
      - run: bun run build

      # Bun downloads the runtime for each target on first use; five targets, one job.
      - run: bun run build:binary bun-linux-x64 bun-linux-arm64 bun-darwin-arm64 bun-darwin-x64 bun-windows-x64

      # tar.gz keeps the executable bit on Linux and macOS; Windows gets a zip.
      - name: Package
        run: |
          cd dist
          for f in voice-training-linux-* voice-training-darwin-*; do
            tar -czf "$f.tar.gz" "$f" && rm "$f"
          done
          for f in voice-training-windows-*.exe; do
            zip -q "${f%.exe}.zip" "$f" && rm "$f"
          done
          sha256sum * > SHA256SUMS.txt
          ls -la

      # Signed provenance linking each archive to this workflow run and commit;
      # verify a download with `gh attestation verify <file> -R princess-pixels/voice-training`.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz, dist/*.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --notes is prepended to the generated changelog; --notes-file is not documented to combine.
          # The notes are this release's section of CHANGELOG.md (up to the next
          # "## [" heading) followed by the download table in release-notes.md.
          section="$(awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md)"
          notes="$(printf '%s\n\n%s' "${section}" "$(cat .github/release-notes.md)")"
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "voice-training ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "${notes}"
