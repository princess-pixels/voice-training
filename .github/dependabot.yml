version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Same three-day cooldown as bunfig.toml's minimumReleaseAge: a freshly
    # published version is not proposed until it has been out for a while.
    cooldown:
      default-days: 3
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is the native compiler; svelte-check needs TS 6 alongside
      # it and the --tsgo flag, so that move is a planned migration (TODO.md),
      # not a bump. Minor and patch updates still come through.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
